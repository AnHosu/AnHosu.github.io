theme: "hugo-bearblog"

title: Local Optima
baseurl: ''
copyright: '© {year} Anders E. Nielsen'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

relativeURLs: true
enableGitInfo: false
summaryLength: 30
paginate: 10
enableEmoji: true
enableRobotsTXT: true
ignoreFiles: [\.qmd$, \.quarto_ipynb$, \.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$, "\\.knit\\.md$", "\\.utf8\\.md$"]
disableAliases: true
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
    # Leave TeX untouched for MathJax (pages with `math: true`). Only dollar
    # delimiters: Quarto writes math that way, and `\[`/`\(` are Markdown
    # escapes for literal brackets (e.g. citations like \[1\])
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$']]
          inline: [['$', '$']]
  highlight:
    # Emit CSS classes; colours come from static/css/syntax-{light,dark}.css
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
    codeFences: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
taxonomies:
  tag: tags
security:
  allowContent:
    - '.*'
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^BLOGDOWN_POST_RELREF$'

params:
  description: ''
  favicon: favicon.png
  dateFormat: '02 Jan, 2006'
  hideMadeWithLine: true
