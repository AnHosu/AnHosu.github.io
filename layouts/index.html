{{ define "main" }}
{{ .Content }}
<ul class="blog-posts">
  {{ range sort (where site.RegularPages "Type" "post") "Date" "desc" }}
  <li>
    <span>
      <i>
        <time datetime='{{ .Date.Format "2006-01-02" }}'>
          {{ .Date.Format (default "02 Jan, 2006" site.Params.dateFormat) }}
        </time>
      </i>
    </span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ else }}
  <li>No posts yet</li>
  {{ end }}
</ul>
{{ end }}
